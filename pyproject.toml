[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tweet-audit"
version = "0.1.0"
description = "Audit an X archive against custom alignment criteria using Gemini."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Seth Goldman" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
tweet-audit = "tweet_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tweet_audit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

